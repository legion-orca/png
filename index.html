<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>AQUILA CAPTURE · LOCKED</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d2547;--blue:#1f5fbf;--sky:#8fc3ee;--teal:#2aa3a8;--mist:#eef5fc;--line:#c9dcf0;--sub:#6a84a3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Noto Sans KR',sans-serif;color:var(--navy);background:#fff;
  background-image:linear-gradient(#eaf2fb 1px,transparent 1px),linear-gradient(90deg,#eaf2fb 1px,transparent 1px);
  background-size:32px 32px;display:flex;align-items:center;justify-content:center;padding:16px;
}
.gate{
  width:100%;max-width:360px;background:#fff;border:1.5px solid var(--navy);border-radius:16px;
  box-shadow:6px 6px 0 var(--mist),6px 6px 0 1.5px var(--line);overflow:hidden;
}
.head{
  display:flex;justify-content:space-between;align-items:center;padding:11px 16px;
  border-bottom:1.5px solid var(--navy);background:linear-gradient(90deg,var(--mist),#fff);
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;font-weight:600;
}
.head i{font-style:normal;color:var(--sub);font-weight:400}
.dot{width:7px;height:7px;border-radius:50%;background:#c4485a;display:inline-block;margin-right:7px;animation:b 1.8s infinite}
.ok .dot{background:var(--teal)}
@keyframes b{50%{opacity:.25}}
.body{padding:26px 22px 22px;text-align:center}
.emblem{width:70px;height:70px;margin:0 auto 12px;display:block}
h1{font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:.14em;font-weight:600}
h1 span{color:var(--blue)}
.hint{margin-top:8px;font-size:12.5px;color:var(--sub)}
.slots{display:flex;gap:10px;justify-content:center;margin:22px 0 6px}
.slot{
  width:48px;height:56px;border:1.5px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--navy);background:#fbfdff;transition:.15s;
}
.slot.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,95,191,.1)}
.slot.fill::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--navy)}
.shake .slots{animation:sh .38s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#pw{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.pad button{
  font-family:'IBM Plex Mono',monospace;font-size:17px;padding:12px 0;border-radius:10px;cursor:pointer;
  border:1.5px solid var(--navy);background:#fff;color:var(--navy);transition:.12s;
}
.pad button:hover{background:var(--mist)}
.pad button:active{background:var(--blue);color:#fff;border-color:var(--blue)}
.pad .fn{font-size:11px;letter-spacing:.1em;border-color:var(--line);color:var(--sub)}
.status{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--sub);min-height:14px}
.status.err{color:#c4485a}.status.ok{color:var(--teal)}
.foot{border-top:1px dashed var(--line);padding:10px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--sub)}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="head"><span><span class="dot"></span>RESTRICTED CHANNEL</span><i>잠금</i></div>
  <div class="body">
    <svg class="emblem" viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="29" stroke="#0d2547" stroke-width="1.6"/>
      <circle cx="32" cy="32" r="24" stroke="#8fc3ee" stroke-width="1" stroke-dasharray="2 3"/>
      <path d="M32 2v6M32 56v6M2 32h6M56 32h6" stroke="#0d2547" stroke-width="1.6"/>
      <path d="M32 11l3 7h-6z" fill="#1f5fbf"/>
      <path d="M17 36c3-7 11-10 19-9 6 1 10 4 12 8-3 0-5 1-7 3-3 2-8 3-13 2-5 0-9-2-11-4z" fill="#0d2547"/>
      <path d="M31 27.5l2-6 3 6" fill="#0d2547"/>
      <path d="M44 34c2-1 4-3 5-5 0 3-1 5-3 6z" fill="#0d2547"/>
      <ellipse cx="24" cy="34" rx="2.6" ry="1.4" fill="#fff"/>
      <path d="M21 38.5c4 2 11 2 16 0-4 3-12 3-16 0z" fill="#fff"/>
      <circle cx="21.5" cy="33.6" r=".9" fill="#fff"/>
    </svg>
    <h1>AQUILA<span>/</span>CAPTURE</h1>
    <p class="hint">승인 코드 네 자리를 입력해 주세요</p>
    <input id="pw" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
    <div class="slots" id="slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
    <div class="pad" id="pad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button class="fn" data-k="clr">CLR</button><button>0</button><button class="fn" data-k="del">DEL</button>
    </div>
    <div class="status" id="st">AWAITING AUTHORIZATION</div>
  </div>
  <div class="foot">KNS-AQUILA · LEGION / ORCA</div>
</div>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let v="",busy=false;
const gate=document.getElementById('gate'),st=document.getElementById('st'),pw=document.getElementById('pw');
const slots=[...document.querySelectorAll('.slot')];
function draw(){slots.forEach((s,k)=>{s.classList.toggle('fill',k<v.length);s.classList.toggle('on',k===v.length)})}
function msg(t,c){st.className='status'+(c?' '+c:'');st.textContent=t}
async function tryOpen(){
  busy=true;msg('DECRYPTING…');
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(v),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},key,u(P.d));
    gate.classList.add('ok');msg('ACCESS GRANTED','ok');
    const html=new TextDecoder().decode(pt);
    setTimeout(()=>{document.open();document.write(html);document.close()},350);
  }catch(e){
    msg('ACCESS DENIED · 코드가 맞지 않아요','err');
    gate.classList.remove('shake');void gate.offsetWidth;gate.classList.add('shake');
    setTimeout(()=>{v="";draw();busy=false},450);
  }
}
function key(k){
  if(busy)return;
  if(k==='del')v=v.slice(0,-1);else if(k==='clr')v="";else if(/^\d$/.test(k)&&v.length<4)v+=k;
  draw();if(v.length===4)tryOpen();
}
document.getElementById('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(b)key(b.dataset.k||b.textContent)});
document.addEventListener('keydown',e=>{if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');else if(e.key==='Escape')key('clr')});
if(!window.crypto||!crypto.subtle)msg('이 브라우저(또는 http 주소)에서는 잠금 해제가 안 돼요','err');
draw();
</script>
