<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQUILA CAPTURE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --navy:#0d2547;
  --blue:#1f5fbf;
  --sky:#8fc3ee;
  --teal:#2aa3a8;
  --mist:#eef5fc;
  --line:#c9dcf0;
  --paper:#ffffff;
  --ink:#16304f;
  --sub:#6a84a3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper)}
body{
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);min-height:100vh;
  background:
    linear-gradient(var(--paper),var(--paper)) padding-box,
    repeating-linear-gradient(0deg,transparent 0 31px,#f0f6fc 31px 32px),
    repeating-linear-gradient(90deg,transparent 0 31px,#f0f6fc 31px 32px);
  background-blend-mode:normal;
}
.grid-bg{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(#eaf2fb 1px,transparent 1px),
    linear-gradient(90deg,#eaf2fb 1px,transparent 1px);
  background-size:32px 32px;
}
.mono{font-family:'IBM Plex Mono',monospace}

/* ---------- header ---------- */
header{
  max-width:1360px;margin:0 auto;padding:28px 24px 0;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:16px}
.emblem{width:62px;height:62px;flex:none}
.brand h1{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:26px;letter-spacing:.12em;color:var(--navy);line-height:1}
.brand h1 span{color:var(--blue)}
.brand p{margin-top:7px;font-size:12.5px;color:var(--sub)}
.callsign{
  display:flex;gap:8px;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--sub);letter-spacing:.08em
}
.tag{border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:#fff}
.tag b{color:var(--navy);font-weight:600}
.tag.l b{color:var(--blue)}
.tag.o b{color:var(--teal)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);display:inline-block;margin-right:6px;animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.wave{max-width:1360px;margin:18px auto 0;padding:0 24px}
.wave svg{display:block;width:100%;height:22px}

/* ---------- layout ---------- */
main{
  max-width:1360px;margin:0 auto;padding:18px 24px 48px;
  display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:22px;align-items:start;
}
.panel{
  background:#fff;border:1.5px solid var(--navy);border-radius:14px;position:relative;
  box-shadow:5px 5px 0 var(--mist),5px 5px 0 1.5px var(--line);
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;border-bottom:1.5px solid var(--navy);
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;color:var(--navy);font-weight:600;
  background:linear-gradient(90deg,var(--mist),#fff);border-radius:12px 12px 0 0;
}
.panel-head i{font-style:normal;color:var(--sub);font-weight:400;letter-spacing:.06em}
.side{display:flex;flex-direction:column;gap:22px;position:sticky;top:18px}

.sec{padding:16px}
.label{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;color:var(--blue);
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.label::after{content:"";flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}

/* file */
.drop{
  display:block;
  border:1.5px dashed var(--sky);border-radius:10px;padding:16px;text-align:center;cursor:pointer;
  background:repeating-linear-gradient(-45deg,#fff 0 10px,#f6fafe 10px 20px);transition:.2s;
}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--mist)}
.drop strong{display:block;font-size:13.5px;color:var(--navy);font-weight:500}
.drop small{display:block;margin-top:4px;font-size:11.5px;color:var(--sub);font-family:'IBM Plex Mono',monospace}
#fileInput{display:none}

/* editor */
textarea{
  width:100%;height:340px;resize:vertical;border:1px solid var(--line);border-radius:10px;
  padding:12px 13px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.6;color:var(--ink);
  background:#fbfdff;outline:none;tab-size:2;
}
textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,95,191,.1)}
.meta{display:flex;justify-content:space-between;margin-top:7px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sub)}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font-family:inherit;cursor:pointer}
.btn{
  flex:1;min-width:110px;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:500;
  border:1.5px solid var(--navy);background:#fff;color:var(--navy);transition:.15s;
}
.btn:hover{background:var(--mist)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--blue);border-color:var(--blue)}

/* segmented */
.seg{display:flex;border:1.5px solid var(--navy);border-radius:9px;overflow:hidden}
.seg button{
  flex:1;padding:9px 6px;border:none;background:#fff;color:var(--navy);font-size:12.5px;
  border-right:1px solid var(--line);
}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--blue);color:#fff}
.opt{margin-bottom:13px}
.opt-name{font-size:12px;color:var(--sub);margin-bottom:6px;display:flex;justify-content:space-between}
.opt-name span{font-family:'IBM Plex Mono',monospace;font-size:10.5px}

.save-btn{
  width:100%;margin-top:4px;padding:14px;border-radius:11px;border:1.5px solid var(--navy);
  background:var(--navy);color:#fff;font-size:14px;font-weight:700;letter-spacing:.04em;
  display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;
}
.save-btn::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(143,195,238,.35) 50%,transparent 70%);
  transform:translateX(-100%);transition:.6s;
}
.save-btn:hover::before{transform:translateX(100%)}
.save-btn:disabled{opacity:.6;cursor:wait}
.status{
  margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--sub);
  display:flex;align-items:center;gap:6px;min-height:16px;
}
.status.ok{color:var(--teal)}
.status.err{color:#c4485a}

/* preview */
.stage-head-tools{display:flex;gap:6px}
.mini{
  border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--navy);letter-spacing:.06em;
}
.mini:hover{border-color:var(--blue);color:var(--blue)}
.stage{
  padding:28px 20px 34px;overflow:auto;border-radius:0 0 12px 12px;
  background:
    radial-gradient(circle at 1px 1px,#d6e5f4 1px,transparent 1.4px) 0 0/18px 18px,
    #f7fbff;
  min-height:520px;position:relative;
}
.frame-wrap{margin:0 auto;position:relative;transition:width .3s}
.frame-wrap::before,.frame-wrap::after{
  content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--blue);pointer-events:none;
}
.frame-wrap::before{top:-8px;left:-8px;border-right:none;border-bottom:none}
.frame-wrap::after{bottom:-8px;right:-8px;border-left:none;border-top:none}
iframe{display:block;width:100%;border:none;background:transparent;min-height:120px}
.ruler{
  margin:0 auto 12px;display:flex;align-items:center;gap:8px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sub);letter-spacing:.1em;transition:width .3s;
}
.ruler::before,.ruler::after{content:"";flex:1;height:1px;background:var(--sky)}

footer{
  text-align:center;padding:0 24px 30px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  color:var(--sub);letter-spacing:.12em;
}
footer svg{vertical-align:middle;margin:0 6px}

@media (max-width:900px){
  main{grid-template-columns:1fr}
  .side{position:static}
  .stage{padding:20px 12px 26px}
}
@media (max-width:520px){
  header{padding:20px 16px 0}
  main,.wave{padding-left:16px;padding-right:16px}
  .brand h1{font-size:20px}
  .emblem{width:50px;height:50px}
}
</style>
</head>
<body>
<div class="grid-bg"></div>

<header>
  <div class="brand">
    <!-- emblem: compass ring + small orca -->
    <svg class="emblem" viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="29" stroke="#0d2547" stroke-width="1.6"/>
      <circle cx="32" cy="32" r="24" stroke="#8fc3ee" stroke-width="1" stroke-dasharray="2 3"/>
      <path d="M32 2v6M32 56v6M2 32h6M56 32h6" stroke="#0d2547" stroke-width="1.6"/>
      <path d="M32 11l3 7h-6z" fill="#1f5fbf"/>
      <!-- orca -->
      <path d="M17 36c3-7 11-10 19-9 6 1 10 4 12 8-3 0-5 1-7 3-3 2-8 3-13 2-5 0-9-2-11-4z" fill="#0d2547"/>
      <path d="M31 27.5l2-6 3 6" fill="#0d2547"/>
      <path d="M44 34c2-1 4-3 5-5 0 3-1 5-3 6z" fill="#0d2547"/>
      <ellipse cx="24" cy="34" rx="2.6" ry="1.4" fill="#fff"/>
      <path d="M21 38.5c4 2 11 2 16 0-4 3-12 3-16 0z" fill="#fff"/>
      <circle cx="21.5" cy="33.6" r=".9" fill="#fff"/>
    </svg>
    <div>
      <h1>AQUILA<span>/</span>CAPTURE</h1>
      <p>HTML을 붙여 넣거나 불러와서 미리 보고, 그대로 PNG로 저장하는 함내 기록 단말</p>
    </div>
  </div>
  <div class="callsign">
    <span class="tag"><span class="dot"></span>KNS-AQUILA</span>
    <span class="tag l">CALL <b>LEGION</b></span>
    <span class="tag o">CALL <b>ORCA</b></span>
  </div>
</header>

<div class="wave">
  <svg viewBox="0 0 1200 22" preserveAspectRatio="none">
    <path d="M0 11 Q 25 2 50 11 T 100 11 T 150 11 T 200 11 T 250 11 T 300 11 T 350 11 T 400 11 T 450 11 T 500 11 T 550 11 T 600 11 T 650 11 T 700 11 T 750 11 T 800 11 T 850 11 T 900 11 T 950 11 T 1000 11 T 1050 11 T 1100 11 T 1150 11 T 1200 11" stroke="#8fc3ee" stroke-width="1.4" fill="none"/>
    <path d="M0 15 Q 25 8 50 15 T 100 15 T 150 15 T 200 15 T 250 15 T 300 15 T 350 15 T 400 15 T 450 15 T 500 15 T 550 15 T 600 15 T 650 15 T 700 15 T 750 15 T 800 15 T 850 15 T 900 15 T 950 15 T 1000 15 T 1050 15 T 1100 15 T 1150 15 T 1200 15" stroke="#1f5fbf" stroke-width="1" fill="none" opacity=".45"/>
  </svg>
</div>

<main>
  <div class="side">
    <!-- INPUT -->
    <section class="panel">
      <div class="panel-head">01 · TRANSMISSION IN <i>입력</i></div>
      <div class="sec">
        <div class="label">FILE</div>
        <label class="drop" id="drop">
          <strong>HTML 파일 불러오기</strong>
          <small id="fileName">.html / .htm / .txt — 클릭 또는 끌어다 놓기</small>
          <input type="file" id="fileInput" accept=".html,.htm,.txt,text/html,text/plain">
        </label>
      </div>
      <div class="sec" style="padding-top:0">
        <div class="label">SOURCE</div>
        <textarea id="code" spellcheck="false"></textarea>
        <div class="meta"><span id="count">0 chars</span><span>Ctrl/⌘ + Enter = 적용</span></div>
        <div class="row">
          <button class="btn primary" id="applyBtn">미리보기 적용</button>
          <button class="btn" id="resetBtn">샘플로 되돌리기</button>
        </div>
      </div>
    </section>

    <!-- SAVE -->
    <section class="panel">
      <div class="panel-head">02 · ARCHIVE OUT <i>저장</i></div>
      <div class="sec">
        <div class="opt">
          <div class="opt-name">저장 폭 <span id="widthLabel">640px</span></div>
          <div class="seg" id="segWidth">
            <button data-v="640" class="on">일반</button>
            <button data-v="1000">넓게</button>
            <button data-v="auto">원본 그대로</button>
          </div>
        </div>
        <div class="opt">
          <div class="opt-name">해상도 <span>retina</span></div>
          <div class="seg" id="segScale">
            <button data-v="1">1×</button>
            <button data-v="2" class="on">2×</button>
            <button data-v="3">3×</button>
          </div>
        </div>
        <div class="opt">
          <div class="opt-name">배경</div>
          <div class="seg" id="segBg">
            <button data-v="#ffffff" class="on">흰색</button>
            <button data-v="#eef5fc">미스트</button>
            <button data-v="transparent">투명</button>
          </div>
        </div>
        <button class="save-btn" id="saveBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v8m0 0l-3.5-3.5M8 10l3.5-3.5M2.5 12.5v1h11v-1" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          PNG로 저장
        </button>
        <div class="status" id="status">STANDBY · 현재 모드: 일반 저장</div>
      </div>
    </section>
  </div>

  <!-- PREVIEW -->
  <section class="panel">
    <div class="panel-head">
      03 · MONITOR <i>미리보기</i>
      <div class="stage-head-tools">
        <button class="mini" id="newWinBtn">새 창으로 ↗</button>
      </div>
    </div>
    <div class="stage">
      <div class="ruler mono" id="ruler">640 PX</div>
      <div class="frame-wrap" id="frameWrap" style="width:640px">
        <iframe id="preview" title="preview"></iframe>
      </div>
    </div>
  </section>
</main>

<footer>
  LEGION
  <svg width="40" height="10" viewBox="0 0 40 10"><path d="M0 5 Q5 0 10 5 T20 5 T30 5 T40 5" stroke="#8fc3ee" fill="none" stroke-width="1.3"/></svg>
  ORCA · SIGNAL KEPT ABOARD KNS-AQUILA
</footer>

<script>
const SAMPLE = `<div style="background:#ffffff;border:1.5px solid #0d2547;border-radius:12px;padding:22px;font-family:'Noto Sans KR',sans-serif;color:#16304f;max-width:560px;margin:0 auto;">
  <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1f5fbf;padding-bottom:10px;">
    <b style="font-size:15px;letter-spacing:2px;color:#0d2547;">KNS-AQUILA · 함내 교신 기록</b>
    <small style="color:#6a84a3;">CH.07 / 02:14</small>
  </div>

  <p style="margin:14px 0 4px;font-size:12px;color:#2aa3a8;">▸ GUIDE ORCA → SENTINEL LEGION</p>
  <p style="margin:0;background:#eef5fc;border-radius:8px;padding:10px 12px;line-height:1.7;">
    바울아, 브리핑 아직이야? 너 또 밥 거르고 있지.<br>
    <small style="color:#6a84a3;">(가이딩 시간 넘었어. 수신 확인해.)</small>
  </p>

  <p style="margin:14px 0 4px;font-size:12px;color:#1f5fbf;text-align:right;">VICE ADM. LEGION → ORCA ◂</p>
  <p style="margin:0;background:#0d2547;color:#fff;border-radius:8px;padding:10px 12px;line-height:1.7;text-align:right;">
    수신했습니다. 오 분만 기다려 주세요.<br>
    <mark style="background:#8fc3ee;color:#0d2547;padding:0 3px;">누나 오면 같이 먹으려고 남겨 뒀어요.</mark>
  </p>

  <hr style="border:none;border-top:1px dashed #c9dcf0;margin:18px 0 10px;">
  <details>
    <summary style="cursor:pointer;color:#6a84a3;font-size:13px;">승무원 메모 보기(펼치기)</summary>
    <div style="margin-top:10px;font-size:13px;line-height:1.8;">
      <p><b>통신병 A:</b> 이 채널 함대 공용인데요...</p>
      <p><b>조타수 B:</b> 부제독님이 존댓말 쓰는 사람 함내에 한 명뿐임</p>
      <p><b>의무관 C:</b> <u>가이드님 말은 무조건 듣던데</u></p>
      <p><b>LEGION:</b> <del>채널 정리 바랍니다</del> 다들 근무 위치로.</p>
    </div>
  </details>
</div>`;

const $ = s => document.querySelector(s);
const code = $('#code'), frame = $('#preview'), wrap = $('#frameWrap'), ruler = $('#ruler');
const statusEl = $('#status');
const state = { width: '640', scale: 2, bg: '#ffffff' };
const modeName = { '640': '일반 저장', '1000': '넓게 저장', 'auto': '원본 그대로' };

function setStatus(msg, cls){ statusEl.className = 'status' + (cls ? ' ' + cls : ''); statusEl.textContent = msg; }
function updateCount(){ $('#count').textContent = code.value.length.toLocaleString() + ' chars'; }

function buildDoc(html){
  // 완전한 문서면 그대로, 조각이면 기본 틀로 감싸기
  if (/<html[\s>]/i.test(html) || /<!doctype/i.test(html)) return html;
  return `<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}body{padding:16px;font-family:'Noto Sans KR',sans-serif}</style>
</head><body>${html}</body></html>`;
}

let fitRaf = 0;
function measure(){
  const d = frame.contentDocument;
  if (!d || !d.documentElement) return 0;
  // 뷰포트 높이와 무관한 실제 콘텐츠 높이
  const r = d.documentElement.getBoundingClientRect().height;
  const b = d.body ? d.body.getBoundingClientRect().bottom : 0;
  return Math.ceil(Math.max(r, b, 120));
}
function fitHeight(){
  cancelAnimationFrame(fitRaf);
  fitRaf = requestAnimationFrame(() => {
    try{
      const h = measure();
      if (h && Math.abs(frame.offsetHeight - h) > 1) frame.style.height = h + 'px';
    }catch(e){}
  });
}

function apply(){
  frame.onload = () => {
    fitHeight();
    const d = frame.contentDocument;
    // details 펼침, 이미지 로드, 폰트 로드 후 높이 다시 맞추기
    d.addEventListener('toggle', fitHeight, true);
    d.querySelectorAll('img').forEach(i => i.addEventListener('load', fitHeight));
    if (d.fonts) d.fonts.ready.then(fitHeight);
    new ResizeObserver(fitHeight).observe(d.body || d.documentElement);
  };
  frame.srcdoc = buildDoc(code.value);
  setStatus('APPLIED · 미리보기 갱신됨', 'ok');
}

function setWidth(v){
  state.width = v;
  if (v === 'auto'){
    wrap.style.width = '100%'; ruler.style.width = '100%'; ruler.textContent = 'AUTO WIDTH';
    $('#widthLabel').textContent = 'auto';
  } else {
    wrap.style.width = v + 'px'; ruler.style.width = v + 'px'; ruler.textContent = v + ' PX';
    $('#widthLabel').textContent = v + 'px';
  }
  setTimeout(fitHeight, 320);
  setStatus('STANDBY · 현재 모드: ' + modeName[v]);
}

function bindSeg(id, key, fn){
  document.querySelectorAll('#' + id + ' button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#' + id + ' button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      const v = b.dataset.v;
      if (fn) fn(v); else state[key] = key === 'scale' ? Number(v) : v;
    });
  });
}
bindSeg('segWidth', 'width', setWidth);
bindSeg('segScale', 'scale');
bindSeg('segBg', 'bg');

// file
function readFile(f){
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { code.value = r.result; updateCount(); apply(); $('#fileName').textContent = f.name; };
  r.readAsText(f, 'utf-8');
}
$('#fileInput').addEventListener('change', e => readFile(e.target.files[0]));
const drop = $('#drop');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => readFile(e.dataTransfer.files[0]));

// buttons
$('#applyBtn').addEventListener('click', apply);
$('#resetBtn').addEventListener('click', () => { code.value = SAMPLE; updateCount(); apply(); $('#fileName').textContent = '.html / .htm / .txt — 클릭 또는 끌어다 놓기'; });
code.addEventListener('input', updateCount);
code.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); apply(); }
  if (e.key === 'Tab'){ e.preventDefault(); const s = code.selectionStart; code.setRangeText('  ', s, code.selectionEnd, 'end'); }
});
$('#newWinBtn').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([buildDoc(code.value)], { type: 'text/html' }));
  window.open(url, '_blank');
});

// save
$('#saveBtn').addEventListener('click', async () => {
  const btn = $('#saveBtn');
  const d = frame.contentDocument;
  if (!d || !d.body){ setStatus('ERROR · 먼저 미리보기를 적용해 주세요', 'err'); return; }
  btn.disabled = true; setStatus('CAPTURING · 이미지 만드는 중…');
  try{
    if (d.fonts) await d.fonts.ready;
    const el = d.documentElement;
    const h = measure();
    frame.style.height = h + 'px';
    await new Promise(r => requestAnimationFrame(r));
    const w = el.scrollWidth;
    const canvas = await html2canvas(d.body, {
      backgroundColor: state.bg === 'transparent' ? null : state.bg,
      scale: state.scale,
      useCORS: true,
      width: w, height: h,
      windowWidth: w, windowHeight: h,
      x: 0, y: 0, scrollX: 0, scrollY: 0
    });
    const stamp = new Date();
    const pad = n => String(n).padStart(2, '0');
    const name = `aquila_${stamp.getFullYear()}${pad(stamp.getMonth()+1)}${pad(stamp.getDate())}_${pad(stamp.getHours())}${pad(stamp.getMinutes())}${pad(stamp.getSeconds())}.png`;
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      setStatus(`SAVED · ${name} (${canvas.width}×${canvas.height})`, 'ok');
      btn.disabled = false;
    }, 'image/png');
  }catch(err){
    console.error(err);
    setStatus('ERROR · 저장 실패 — 외부 이미지 주소를 확인해 주세요', 'err');
    btn.disabled = false;
  }
});

window.addEventListener('resize', fitHeight);
code.value = SAMPLE; updateCount(); apply();
</script>
